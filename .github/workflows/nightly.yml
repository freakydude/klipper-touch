name: Nightly

# Jede Nacht: Stand von main als Vorab-Release "nightly-<datum>-<commit>" veroeffentlichen und die vorigen
# Nightlies entfernen, aber nur, wenn sich main seit dem letzten Nightly geaendert hat. Manuell mit "force".
# Eindeutiger Tag je Build, weil Moonraker (Kanal beta) Versionen nur auf Gleichheit vergleicht.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and publish even without new commits"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  changes:
    name: Changes since last nightly
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      tag: ${{ steps.compare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: compare
        run: |
          current=$(git rev-parse HEAD)
          last_tag=$(git tag -l 'nightly-*' --sort=-creatordate | head -n 1)
          previous=$( [ -n "$last_tag" ] && git rev-parse "$last_tag^{commit}" || echo none)
          echo "current=$current previous=$previous ($last_tag) force=${{ inputs.force }}"
          echo "tag=nightly-$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes on main since the last nightly ($previous); nothing to do."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish nightly
    needs: [changes, build]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.changes.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack
        working-directory: artifacts
        run: bash ../.github/scripts/pack-artifacts.sh "$TAG"
      - name: Replace nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" artifacts/*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly $(date -u +%Y-%m-%d) ($(git rev-parse --short HEAD))" \
            --notes "Automatic build of main at $GITHUB_SHA. Replaced every night when main has changed. Untested experiment, use at your own risk."
          for old in $(gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("nightly"))'); do
            if [ "$old" != "$TAG" ]; then gh release delete "$old" --yes --cleanup-tag; fi
          done
