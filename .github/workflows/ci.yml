name: CI

# Jeder Push auf jeden Branch und jeder Pull Request: Tests und Builds aller Plattformen.
# Ein Tag v* (z. B. v0.3.0) erzeugt zusaetzlich ein dauerhaftes Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Pack
        working-directory: artifacts
        run: bash ../.github/scripts/pack-artifacts.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*.zip artifacts/*.tar.gz \
            --title "klipper-touch-slint ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
