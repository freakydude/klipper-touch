name: CI

on:
  push:
    branches: [main, slint-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Slint
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: cargo build --release -p klipper-touch-slint --bin klipper-touch-slint
      - uses: actions/upload-artifact@v4
        with:
          name: klipper-touch-slint-windows-x86_64
          path: target/release/klipper-touch-slint.exe

  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Debian Bullseye: aelteste unterstuetzte glibc, damit das Programm auch auf Bookworm und Trixie laeuft.
    container: debian:bullseye
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            triple: x86_64-linux-gnu
            compiler: gcc
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            triple: aarch64-linux-gnu
            compiler: gcc-aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
            triple: arm-linux-gnueabihf
            compiler: gcc-arm-linux-gnueabihf
    steps:
      - name: Toolchain and target libraries
        run: |
          dpkg --add-architecture ${{ matrix.arch }}
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git pkg-config build-essential \
            ${{ matrix.compiler }} libfontconfig1-dev:${{ matrix.arch }} libxkbcommon-dev:${{ matrix.arch }}
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/${{ matrix.triple }}/pkgconfig
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release -p klipper-touch-slint --bin klipper-touch-slint --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/klipper-touch-slint dist/
          cp scripts/install.sh scripts/uninstall.sh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: klipper-touch-slint-${{ matrix.target }}
          path: dist/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack
        run: |
          cd artifacts
          for directory in */; do tar -czf "${directory%/}.tar.gz" -C "$directory" .; done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
