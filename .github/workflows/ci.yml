name: CI

# Every push to any branch and every pull request: tests and builds for all platforms.
# A tag v* (e.g. v0.3.0) additionally creates a permanent release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    # Packs on every run (checks the package format); publishes only for tags v*.
    name: Package and release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: klipper-touch-*
          path: artifacts
      - name: Pack
        working-directory: artifacts
        run: |
          bash ../.github/scripts/pack-artifacts.sh "$VERSION"
          for archive in *linux*.zip; do
            unzip -Z -l "$archive"
            unzip -p "$archive" release_info.json | python3 -m json.tool
          done
          for package in *.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            artifacts/*.zip
            artifacts/*.deb
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*.zip artifacts/*.deb \
            --title "klipper-touch ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
