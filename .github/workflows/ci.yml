name: CI

# Jeder Push auf jeden Branch und jeder Pull Request: Tests und Builds aller Plattformen.
# Ein Tag v* (z. B. v0.3.0) erzeugt zusaetzlich ein dauerhaftes Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    # Packt bei jedem Lauf (prueft das Paketformat); veroeffentlicht nur bei Tags v*.
    name: Package and release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack
        working-directory: artifacts
        run: |
          bash ../.github/scripts/pack-artifacts.sh "$VERSION"
          for archive in *linux*.zip; do
            unzip -Z -l "$archive"
            unzip -p "$archive" release_info.json | python3 -m json.tool
          done
          for package in *.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*.zip artifacts/*.deb \
            --title "klipper-touch ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
