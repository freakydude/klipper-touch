name: 'prerelease-latest'
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ !(github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')) }}
env:
  tagName: prerelease-latest
  releaseName: prerelease-latest
  preRelease: true
  CARGO_TERM_COLOR: always
  nodeVersion: 24.15.0
jobs:
  release-amd64:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.nodeVersion }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: |
          npm ci
      - name: Build and Upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.tagName }} # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: ${{ env.releaseName }}
          releaseBody: Autobuilded packages of latest 'main' branch commit
          releaseDraft: false
          prerelease: ${{ env.preRelease }}

  release-arm:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
        include:
          - arch: aarch64
            cpu: cortex-a72
            base_image: https://dietpi.com/downloads/images/DietPi_RPi5-ARMv8-Bookworm.img.xz

    steps:
      - uses: actions/checkout@v6

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Build app
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: ${{ matrix.base_image }}
          cpu: ${{ matrix.cpu }}
          bind_mount_repository: true
          image_additional_mb: 10240
          optimize_image: no
          #exit_on_fail: no
          commands: |
            # Prevent Rust from complaining about $HOME not matching eid home
            export HOME=/root

            # Workaround to CI worker being stuck on Updating crates.io index
            export CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse

            # Install setup prerequisites
            apt-get update -y --allow-releaseinfo-change
            apt-get autoremove -y
            apt-get install -y --no-install-recommends --no-install-suggests curl xz-utils libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
            curl https://sh.rustup.rs -sSf | sh -s -- -y
            . "$HOME/.cargo/env"

            # Install Node from official tarballs to keep ARM builds deterministic.
            NODE_VERSION="${{ env.nodeVersion }}"
            NODE_DIST_ARCH="arm64"

            NODE_DIST_URL="https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_DIST_ARCH}.tar.xz"
            if ! curl -fsI "$NODE_DIST_URL" >/dev/null; then
              echo "Node ${NODE_VERSION} is not available for linux-${NODE_DIST_ARCH}."
              exit 1
            fi

            curl -fsSL "$NODE_DIST_URL" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            node -v
            npm -v

            # Install frontend dependencies
            npm config set engine-strict false
            npm ci

            # Build the application
            npm run tauri build -- --verbose

      - name: Get app version
        run: echo "APP_VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV

      - name: Get product name
        run: echo "APP_NAME=$(jq -r .productName src-tauri/tauri.conf.json)" >> $GITHUB_ENV

      - name: Resolve bundle file paths
        run: |
          DEB_BUNDLE=$(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/deb" -maxdepth 1 -type f -name '*.deb' | head -n 1)
          RPM_BUNDLE=$(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/rpm" -maxdepth 1 -type f -name '*.rpm' | head -n 1)

          if [ -z "$DEB_BUNDLE" ]; then
            echo "No .deb bundle found"
            exit 1
          fi

          if [ -z "$RPM_BUNDLE" ]; then
            echo "No .rpm bundle found"
            exit 1
          fi

          echo "DEB_BUNDLE=$DEB_BUNDLE" >> $GITHUB_ENV
          echo "RPM_BUNDLE=$RPM_BUNDLE" >> $GITHUB_ENV

      - name: Upload deb bundle
        uses: actions/upload-artifact@v7
        with:
          name: Debian ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_${{ matrix.arch }}.deb
          path: ${{ env.DEB_BUNDLE }}

      - name: Upload rpm bundle
        uses: actions/upload-artifact@v7
        with:
          name: RPM ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-${{ matrix.arch }}.rpm
          path: ${{ env.RPM_BUNDLE }}

      - name: upload release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.releaseName }}
          tag_name: ${{ env.tagName }}
          prerelease: ${{ env.preRelease }}
          generate_release_notes: true
          files: |
            ${{ env.DEB_BUNDLE }}
            ${{ env.RPM_BUNDLE }}
