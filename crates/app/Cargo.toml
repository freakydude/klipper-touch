[package]
name = "klipper-touch"
description = "Touch screen UI for Klipper printers via Moonraker (Rust + Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "klipper-touch"

[features]
default = []
# Rendering direkt per DRM/KMS ohne Desktop oder Compositor (nur Linux, experimentell).
linuxkms = ["slint/backend-linuxkms-noseat"]

[dependencies]
klipper-touch-core.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log.workspace = true
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
] }
tokio.workspace = true
thiserror.workspace = true

[build-dependencies]
slint-build = "1.18.1"
