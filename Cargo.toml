[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/icon-index", "fake-moonraker"]
default-members = ["crates/app"]

[workspace.package]
# Release versions come from git tags (.github/scripts/version.sh); local builds report this one with "-dev".
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/freakydude/klipper-touch"
rust-version = "1.92"

[workspace.dependencies]
klipper-touch-core = { path = "crates/core" }
fake-moonraker = { path = "fake-moonraker" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
