[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/ui-snapshot",
    "crates/icon-index",
    "fake-moonraker",
]
default-members = ["crates/app"]

[workspace.package]
# Release versions come from git tags (.github/scripts/version.sh); local builds report this one with "-dev".
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/freakydude/freakymate"
rust-version = "1.92"

[workspace.dependencies]
freakymate-core = { path = "crates/core" }
freakymate = { path = "crates/app" }
fake-moonraker = { path = "fake-moonraker" }
futures-util = { version = "0.3.34", default-features = false, features = [
    "sink",
    "std",
] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "connect",
] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
